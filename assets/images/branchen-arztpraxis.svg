  <path d="M380 20 L350 20 M380 20 L380 50" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
  <path d="M20 220 L50 220 M20 220 L20 190" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
  <path d="M380 220 L350 220 M380 220 L380 190" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
</svg>